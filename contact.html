<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – Tiler in Wiltshire, Bath &amp; Bristol | Northstar Tiling</title>
<meta name="description" content="Get in touch for a fast tiling quote. Tiler serving Wiltshire, Bath, Bristol and surrounding areas. Call 07788 577456.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header"></div>

<div class="container breadcrumb-wrap">
  <nav class="breadcrumb">
    <a href="index.html">Home</a>
    <span class="breadcrumb-sep">/</span>
    <span aria-current="page">Contact</span>
  </nav>
</div>

<section class="page-hero">
  <div class="container">
    <h1>Contact</h1>
  </div>
</section>

<section class="section section-white">
  <div class="container contact-grid">
    <div class="contact-info">
      <div class="contact-card">
        <div class="contact-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42a18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"/></svg>
        </div>
        <div>
          <h4>Phone</h4>
          <p>07788 577456</p>
        </div>
      </div>
      <div class="contact-card">
        <div class="contact-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"><path fill="currentColor" d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26l.001.002l4.995 3.178l3.178 4.995l.002.002l.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215l7.494-7.494l1.178-.471z"/></svg>
        </div>
        <div>
          <h4>Email</h4>
          <a href="mailto:jordan@northstartiling.co.uk">jordan@northstartiling.co.uk</a>
        </div>
      </div>
      <div class="contact-card">
        <div class="contact-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"><path fill="currentColor" d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"/><path d="M8 8a2 2 0 1 1 0-4a2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6a3 3 0 0 0 0 6"/></svg>
        </div>
        <div>
          <h4>Service Area</h4>
          <p>Based in Trowbridge. Serving Wiltshire, Bath, Bristol & surrounding areas</p>
        </div>
      </div>
    </div>
    <div class="hero-form contact-hero-form">
      <h2>Get in touch</h2>
      <form action="https://formsubmit.co/jordanbrewer1994@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <div class="form-row">
          <div>
            <label for="contactName">Full Name</label>
            <input type="text" id="contactName" placeholder="Your Full Name" required>
          </div>
          <div>
            <label for="contactPhone">Phone Number</label>
            <input type="tel" id="contactPhone" placeholder="07700 000000" required>
          </div>
        </div>
        <div>
          <label for="contactEmail">Email</label>
          <input type="email" id="contactEmail" placeholder="your@email.com">
        </div>
        <div>
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" placeholder="How can we help you?" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-primary"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26l.001.002l4.995 3.178l3.178 4.995l.002.002l.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215l7.494-7.494l1.178-.471z"/></svg> Send Message</button>
      </form>
    </div>
  </div>
</section>

<div id="footer"></div>

<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderHeader('contact');
  renderFooter();
  initScrollAnimations();

  const phoneCard = document.querySelector('.contact-card:nth-child(1)');
  if (phoneCard) {
    phoneCard.addEventListener('click', () => {
      window.location.href = 'tel:4407788577456';
    });
  }
});
</script>
</body>
</html>
