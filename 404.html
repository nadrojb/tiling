<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Avonside Tiling</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css?v=6">
<link rel="icon" type="image/png" href="/images/favicon.png">
</head>
<body>

<div id="header"></div>

<section class="page-hero page-hero--dark">
  <div class="container">
    <div class="page-hero-text">
      <h1>Page Not Found</h1>
      <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
    </div>
  </div>
</section>

<section class="cta section-warm" data-animate>
  <div class="container">
    <h2>Looking for a tiler?</h2>
    <p>Get in touch for a free quote or head back to the homepage.</p>
    <div class="cta-actions">
      <a href="/" class="btn-primary">Back to homepage</a>
      <a href="/contact" class="btn-primary">Get in touch</a>
    </div>
  </div>
</section>

<div id="footer"></div>

<script src="/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderHeader('');
  renderFooter();
  initScrollAnimations();
});
</script>
</body>
</html>
