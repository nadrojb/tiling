<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiling Gallery – Bathroom &amp; Kitchen Tiling in Wiltshire | Northstar Tiling</title>
<meta name="description" content="Browse examples of bathroom tiling, kitchen tiling and floor tiling across Wiltshire, Bath and Bristol.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header"></div>

<div class="container breadcrumb-wrap">
  <nav class="breadcrumb">
    <a href="index.html">Home</a>
    <span class="breadcrumb-sep">/</span>
    <span aria-current="page">Gallery</span>
  </nav>
</div>

<section class="page-hero">
  <div class="container">
    <h1 data-animate>Recent work</h1>
    <p data-animate delay-2>Check out some of my recent tiling projects</p>
  </div>
</section>

<section class="section section-white">
  <div class="container">
    <div class="gallery-grid" id="galleryGrid" data-animate></div>
  </div>
</section>

<section class="section section-warm" style="text-align:center;" data-animate>
  <div class="container">
    <h2 style="margin-bottom:1rem;">Have a project in mind?</h2>
    <a href="contact.html" class="btn-primary" style="display:inline-flex; width:auto; padding:14px 32px;">Get a free quote</a>
  </div>
</section>

<div id="footer"></div>

<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderHeader('gallery');
  renderFooter();
  renderGallery();
  initScrollAnimations();
});
</script>
</body>
</html>
